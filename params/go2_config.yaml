# Unitree Go2 policy deployment config
#
# Two controller types, each with its own policy model:
#   - Go2OnnxController  (blind):  uses policy_name
#   - Go2ParkourController (depth): uses parkour_policy_name
# The active controller is selected by the `controller` field below.
# All policy parameters (joint order, PD gains, default pose, action scale,
# observation terms/scales/clips/history) are read automatically from the
# ONNX model's metadata_props (mjlab exporter convention, same as
# booster_deploy_cpp).  This yaml only supplies the model files, the control
# period, the sit pose and the transition PD gains.

controller: "parkour"                  # "blind" or "parkour"
policy_name: "go2_rough.onnx"        # blind policy (relative to ../models or absolute)
parkour_policy_name: "2026-09-01_11-32-56_parkour_cts_depth_9000.onnx"  # parkour policy
dt: 0.02                           # policy control period (s), 50Hz

# PD gains for the DAMPING -> STAND transition state
stand_kp: 60.0
stand_kd: 5.0

# Fallback PD gains for the CTRL state (overridden by ONNX metadata per-joint
# joint_stiffness/joint_damping when present)
ctrl_kp: 20.0
ctrl_kd: 0.5

# Sit pose for the SIT state (real robot joint order: FR, FL, RR, RL).
# Used for the DAMPING -> SIT transition interpolation.
sit_pos: [
    0.04,
    1.3,
    -2.87,
    -0.02,
    1.29,
    -2.86,
    -0.33,
    1.27,
    -2.81,
    0.32,
    1.28,
    -2.87
]

# --- parkour / depth policy (sim2sim) ---
# depth DDS subscription; sim2sim uses domain 1 + "lo", real robot domain 0 + NIC
depth_enabled: true
depth_domain: 1
depth_interface: "lo"
depth_topic: "rt/depthimage"
depth_visualize: false
